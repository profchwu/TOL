<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>桌球高階認知測試系統</title>
  
  <!-- 引入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 引入 Lucide 圖示庫 -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.4s ease-out forwards;
    }
  </style>
</head>
<body>
  <!-- 應用程式渲染容器 -->
  <div id="app"></div>

  <script>
    // --- 全局狀態管理 ---
    const state = {
      screen: 'menu', // 'menu', 'tol_intro', 'tol_game', 'stroop_intro', 'stroop_game', 'results'
      results: {
        tol: { time: 0, errors: 0, completed: false },
        stroop: { congruentTime: 0, incongruentTime: 0, accuracy: 0, completed: false }
      },
      tol: {
        levels: [
          {
            id: 1,
            goal: "戰術一：接發球先將球控制在網前，接著直接在台內起板攻擊得分。",
            target: ["擺短", "挑打"],
            options: ["擺短", "劈長", "挑打", "退台拉球"]
          },
          {
            id: 2,
            goal: "戰術二：先將球長推到底線逼迫對手退台，對手勉強回擊後，輕鬆擋回空檔，最後致命一擊。",
            target: ["劈長", "擋球", "爆衝"],
            options: ["擺短", "劈長", "擋球", "爆衝", "削球"]
          },
          {
            id: 3,
            goal: "戰術三：先短球過渡，對手回短後，主動切長球改變節奏，對手拉起後，進行高質量反拉。",
            target: ["擺短", "劈長", "反拉"],
            options: ["擺短", "劈長", "挑打", "擋球", "反拉"]
          }
        ],
        currentIndex: 0,
        sequence: [],
        errors: 0,
        startTime: null
      },
      stroop: {
        totalTrials: 12,
        trial: 0,
        data: [], // { type, rxTime, correct }
        currentStimulus: null,
        stimulusTime: null,
        phase: 'ready', // 'ready', 'show', 'feedback'
        feedback: ''
      }
    };

    // --- 核心邏輯與畫面切換 ---
    function setScreen(newScreen) {
      state.screen = newScreen;
      updateDOM();
    }

    // --- TOL 邏輯 ---
    function startTOL() {
      state.tol.currentIndex = 0;
      state.tol.sequence = [];
      state.tol.errors = 0;
      state.tol.startTime = Date.now();
      setScreen('tol_game');
    }

    function handleTolSelect(move) {
      const level = state.tol.levels[state.tol.currentIndex];
      if (state.tol.sequence.length < level.target.length) {
        state.tol.sequence.push(move);
        updateDOM();
      }
    }

    function handleTolRemove(index) {
      state.tol.sequence.splice(index, 1);
      updateDOM();
    }

    function checkTolSequence() {
      const level = state.tol.levels[state.tol.currentIndex];
      const isCorrect = state.tol.sequence.length === level.target.length && 
                        state.tol.sequence.every((val, index) => val === level.target[index]);
      
      if (isCorrect) {
        if (state.tol.currentIndex < state.tol.levels.length - 1) {
          state.tol.currentIndex += 1;
          state.tol.sequence = [];
          updateDOM();
        } else {
          // 完成 TOL
          const timeTaken = (Date.now() - state.tol.startTime) / 1000;
          state.results.tol.time = timeTaken.toFixed(1);
          state.results.tol.errors = state.tol.errors;
          state.results.tol.completed = true;
          setScreen('menu');
        }
      } else {
        state.tol.errors += 1;
        state.tol.sequence = [];
        alert("戰術邏輯錯誤，請重新規劃！(記錄1次誤差)");
        updateDOM();
      }
    }

    // --- Stroop 邏輯 ---
    let stroopTimeout = null;

    function startStroop() {
      state.stroop.trial = 0;
      state.stroop.data = [];
      setScreen('stroop_game');
      nextStroopTrial();
    }

    function nextStroopTrial() {
      state.stroop.phase = 'ready';
      updateDOM();
      
      clearTimeout(stroopTimeout);
      stroopTimeout = setTimeout(() => {
        const isCongruent = Math.random() > 0.5;
        const types = [
          { color: 'bg-red-500', text: '上旋', actualAction: '上旋(壓球)', type: 'congruent' },
          { color: 'bg-blue-500', text: '下旋', actualAction: '下旋(搓球)', type: 'congruent' },
          { color: 'bg-red-500', text: '下旋', actualAction: '上旋(壓球)', type: 'incongruent' },
          { color: 'bg-blue-500', text: '上旋', actualAction: '下旋(搓球)', type: 'incongruent' },
        ];
        
        let pool = isCongruent ? types.slice(0, 2) : types.slice(2, 4);
        const selected = pool[Math.floor(Math.random() * pool.length)];
        
        state.stroop.currentStimulus = selected;
        state.stroop.stimulusTime = Date.now();
        state.stroop.phase = 'show';
        updateDOM();
      }, 1000); // 1秒準備時間
    }

    function handleStroopResponse(action) {
      if (state.stroop.phase !== 'show') return;
      
      const rxTime = Date.now() - state.stroop.stimulusTime;
      const isCorrect = action === state.stroop.currentStimulus.actualAction;
      
      state.stroop.data.push({ 
        type: state.stroop.currentStimulus.type, 
        rxTime, 
        correct: isCorrect 
      });

      state.stroop.feedback = isCorrect ? '✅ 正確' : '❌ 錯誤';
      state.stroop.phase = 'feedback';
      updateDOM();

      clearTimeout(stroopTimeout);
      stroopTimeout = setTimeout(() => {
        if (state.stroop.trial + 1 < state.stroop.totalTrials) {
          state.stroop.trial += 1;
          nextStroopTrial();
        } else {
          // 結算 Stroop
          const congruentTrials = state.stroop.data.filter(d => d.type === 'congruent' && d.correct);
          const incongruentTrials = state.stroop.data.filter(d => d.type === 'incongruent' && d.correct);
          
          const avgCongruent = congruentTrials.length > 0 ? congruentTrials.reduce((sum, d) => sum + d.rxTime, 0) / congruentTrials.length : 0;
          const avgIncongruent = incongruentTrials.length > 0 ? incongruentTrials.reduce((sum, d) => sum + d.rxTime, 0) / incongruentTrials.length : 0;
          const accuracy = (state.stroop.data.filter(d => d.correct).length / state.stroop.totalTrials) * 100;

          state.results.stroop.congruentTime = Math.round(avgCongruent);
          state.results.stroop.incongruentTime = Math.round(avgIncongruent);
          state.results.stroop.accuracy = Math.round(accuracy);
          state.results.stroop.completed = true;
          
          setScreen(state.results.tol.completed ? 'results' : 'menu');
        }
      }, 800);
    }

    function resetAll() {
      state.results = {
        tol: { time: 0, errors: 0, completed: false },
        stroop: { congruentTime: 0, incongruentTime: 0, accuracy: 0, completed: false }
      };
      setScreen('menu');
    }

    // --- 畫面渲染函數 ---
    function renderMenu() {
      const tolBtnStyle = state.results.tol.completed 
        ? 'bg-slate-200 text-slate-500' 
        : 'bg-emerald-500 text-white hover:bg-emerald-600 shadow-md hover:shadow-lg';
      
      const stroopBtnStyle = state.results.stroop.completed 
        ? 'bg-slate-200 text-slate-500' 
        : 'bg-blue-500 text-white hover:bg-blue-600 shadow-md hover:shadow-lg';

      return `
        <div class="flex flex-col items-center justify-center p-8 text-center space-y-8 animate-fade-in w-full">
          <div class="bg-green-700 text-white p-6 rounded-2xl shadow-xl w-full max-w-2xl">
            <h1 class="text-3xl font-bold mb-2 flex items-center justify-center gap-2">
              <i data-lucide="brain-circuit" class="w-8 h-8"></i> 桌球高階認知測試系統
            </h1>
            <p class="text-green-100 mt-2">基於研究：身體活動與久坐對高齡者執行功能之影響</p>
          </div>

          <div class="grid md:grid-cols-2 gap-6 w-full max-w-2xl">
            <div class="bg-white p-6 rounded-2xl shadow-md border-t-4 border-emerald-500 flex flex-col items-center">
              <h2 class="text-xl font-bold mb-4 text-slate-800">1. 戰術規劃測驗 (TOL)</h2>
              <p class="text-slate-600 text-sm mb-6 h-16">
                衡量高階執行功能（計畫與問題解決）。你需要根據戰術目標，排出正確的擊球動作順序。
              </p>
              <button onclick="setScreen('tol_intro')" class="w-full py-3 rounded-lg font-bold flex justify-center items-center gap-2 transition-all ${tolBtnStyle}">
                ${state.results.tol.completed ? '已完成' : '<i data-lucide="play" class="w-5 h-5"></i> 開始測驗'}
              </button>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-md border-t-4 border-blue-500 flex flex-col items-center">
              <h2 class="text-xl font-bold mb-4 text-slate-800">2. 旋轉抑制測驗 (Stroop)</h2>
              <p class="text-slate-600 text-sm mb-6 h-16">
                衡量核心執行功能（反應抑制）。利用顏色與文字的不一致，測試你抗干擾的反應速度。
              </p>
              <button onclick="setScreen('stroop_intro')" class="w-full py-3 rounded-lg font-bold flex justify-center items-center gap-2 transition-all ${stroopBtnStyle}">
                ${state.results.stroop.completed ? '已完成' : '<i data-lucide="play" class="w-5 h-5"></i> 開始測驗'}
              </button>
            </div>
          </div>

          ${state.results.tol.completed && state.results.stroop.completed ? `
            <button onclick="setScreen('results')" class="mt-4 bg-amber-500 text-white px-8 py-3 rounded-full font-bold text-lg shadow-lg hover:bg-amber-600 animate-bounce">
              查看綜合分析報告
            </button>
          ` : ''}
        </div>
      `;
    }

    function renderTolIntro() {
      return `
        <div class="text-center max-w-md animate-fade-in w-full">
          <h2 class="text-2xl font-bold mb-4">戰術規劃測驗說明</h2>
          <p class="text-slate-600 mb-6 text-left bg-white p-4 rounded shadow">
            畫面上會出現教練下達的戰術指令。<br><br>
            請從下方的「動作庫」中，點擊正確的擊球動作，依序排入戰術板中。排錯會記錄一次誤差(TMS)，並計算您完成規畫的總時間(TPST)。
          </p>
          <button onclick="startTOL()" class="bg-emerald-500 text-white w-full py-3 rounded-lg font-bold text-lg hover:bg-emerald-600">
            明白，開始測驗
          </button>
        </div>
      `;
    }

    function renderTolGame() {
      const level = state.tol.levels[state.tol.currentIndex];
      const isSequenceFull = state.tol.sequence.length >= level.target.length;
      const isSubmitDisabled = state.tol.sequence.length !== level.target.length;

      const sequenceHtml = state.tol.sequence.length > 0 
        ? state.tol.sequence.map((move, idx) => `
            <div onclick="handleTolRemove(${idx})" class="bg-emerald-500 text-white px-4 py-2 rounded shadow cursor-pointer hover:bg-red-500 transition-colors flex items-center gap-2" title="點擊移除">
              ${move} <i data-lucide="x" class="w-3.5 h-3.5"></i>
            </div>
          `).join('')
        : '<span class="text-slate-400 italic my-auto ml-2">尚未選擇動作...</span>';

      const optionsHtml = level.options.map(move => `
        <button onclick="handleTolSelect('${move}')" ${isSequenceFull ? 'disabled' : ''} class="bg-white border-2 border-slate-200 text-slate-700 font-bold px-5 py-3 rounded-lg shadow-sm hover:border-emerald-400 hover:text-emerald-600 transition-all disabled:opacity-50 disabled:cursor-not-allowed">
          ${move}
        </button>
      `).join('');

      return `
        <div class="flex flex-col items-center p-6 max-w-3xl mx-auto w-full animate-fade-in">
          <div class="w-full flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-slate-800">戰術規劃測驗 (TOL)</h2>
            <span class="bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full font-semibold">關卡 ${state.tol.currentIndex + 1} / ${state.tol.levels.length}</span>
          </div>

          <div class="bg-slate-800 w-full p-6 rounded-xl shadow-inner mb-6 text-white border-b-4 border-emerald-500">
            <h3 class="text-emerald-400 font-bold mb-2 flex items-center gap-2"><i data-lucide="arrow-right" class="w-5 h-5"></i> 教練指令：</h3>
            <p class="text-lg leading-relaxed">${level.goal}</p>
          </div>

          <div class="w-full mb-8">
            <h3 class="text-slate-600 font-bold mb-3">您的戰術排程（點擊下方選項加入）：</h3>
            <div class="flex gap-2 min-h-[60px] bg-slate-100 p-3 rounded-lg border-2 border-dashed border-slate-300">
              ${sequenceHtml}
            </div>
          </div>

          <div class="w-full mb-8">
            <h3 class="text-slate-600 font-bold mb-3">可用動作庫：</h3>
            <div class="flex flex-wrap gap-3">
              ${optionsHtml}
            </div>
          </div>

          <div class="w-full flex justify-end">
            <button onclick="checkTolSequence()" ${isSubmitDisabled ? 'disabled' : ''} class="bg-slate-800 text-white px-8 py-3 rounded-lg font-bold shadow hover:bg-slate-900 disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2">
              <i data-lucide="check" class="w-5 h-5"></i> 送出戰術
            </button>
          </div>
        </div>
      `;
    }

    function renderStroopIntro() {
      return `
        <div class="text-center max-w-md animate-fade-in w-full">
          <h2 class="text-2xl font-bold mb-4">旋轉抑制測驗說明</h2>
          <p class="text-slate-600 mb-6 text-left bg-white p-4 rounded shadow">
            畫面上會快速飛來一顆球。<br><br>
            如果球是 <strong class="text-red-500">紅色</strong>，請立刻點擊「上旋(壓球)」。<br>
            如果球是 <strong class="text-blue-500">藍色</strong>，請立刻點擊「下旋(搓球)」。<br><br>
            <span class="bg-yellow-100 p-1">注意：請忽略球上面寫的文字干擾！</span>
          </p>
          <button onclick="startStroop()" class="bg-blue-500 text-white w-full py-3 rounded-lg font-bold text-lg hover:bg-blue-600">
            明白，開始測驗
          </button>
        </div>
      `;
    }

    function renderStroopGame() {
      let phaseHtml = '';
      if (state.stroop.phase === 'ready') {
        phaseHtml = `<div class="text-4xl font-bold text-slate-300 animate-pulse">準備...</div>`;
      } else if (state.stroop.phase === 'show' && state.stroop.currentStimulus) {
        phaseHtml = `
          <div class="w-32 h-32 rounded-full ${state.stroop.currentStimulus.color} shadow-2xl flex items-center justify-center transform transition-transform duration-100 scale-110">
            <span class="text-white text-3xl font-black drop-shadow-md">${state.stroop.currentStimulus.text}</span>
          </div>
        `;
      } else if (state.stroop.phase === 'feedback') {
        const isCorrect = state.stroop.feedback.includes('✅');
        phaseHtml = `
          <div class="text-3xl font-bold ${isCorrect ? 'text-green-500' : 'text-red-500'}">
            ${state.stroop.feedback}
          </div>
        `;
      }

      return `
        <div class="flex flex-col items-center justify-center min-h-[500px] p-6 max-w-2xl mx-auto w-full select-none animate-fade-in">
          <div class="w-full flex justify-between items-center mb-8">
            <h2 class="text-2xl font-bold text-slate-800">反應抑制測驗 (Stroop)</h2>
            <span class="bg-blue-100 text-blue-800 px-3 py-1 rounded-full font-semibold">進度 ${state.stroop.trial + 1} / ${state.stroop.totalTrials}</span>
          </div>

          <div class="text-slate-600 mb-8 text-center bg-slate-100 p-4 rounded-lg w-full">
            <p class="font-bold">規則提醒：請根據球的<span class="text-red-500 text-lg mx-1">「顏色」</span>做出反應！</p>
            <p class="text-sm">🔴 紅色 = 上旋(壓球) ｜ 🔵 藍色 = 下旋(搓球) ｜ <span class="underline decoration-wavy">請忽略球上的文字干擾</span></p>
          </div>

          <div class="flex-1 flex flex-col items-center justify-center w-full min-h-[200px]">
            ${phaseHtml}
          </div>

          <div class="grid grid-cols-2 gap-6 w-full mt-12">
            <button onpointerdown="handleStroopResponse('上旋(壓球)')" class="h-24 bg-red-100 border-4 border-red-500 text-red-700 text-xl font-bold rounded-2xl shadow hover:bg-red-200 active:scale-95 transition-transform cursor-pointer select-none">
              🔴 上旋 (壓球)
            </button>
            <button onpointerdown="handleStroopResponse('下旋(搓球)')" class="h-24 bg-blue-100 border-4 border-blue-500 text-blue-700 text-xl font-bold rounded-2xl shadow hover:bg-blue-200 active:scale-95 transition-transform cursor-pointer select-none">
              🔵 下旋 (搓球)
            </button>
          </div>
        </div>
      `;
    }

    function renderResults() {
      const stroopDiff = state.results.stroop.incongruentTime - state.results.stroop.congruentTime;
      const tolErrors = state.results.tol.errors;

      return `
        <div class="flex flex-col items-center p-8 max-w-3xl mx-auto w-full animate-fade-in">
          <h2 class="text-3xl font-black text-slate-800 mb-8 flex items-center gap-3">
            <i data-lucide="activity" class="text-emerald-500 w-9 h-9"></i> 測試結果與文獻分析
          </h2>

          <div class="grid md:grid-cols-2 gap-6 w-full mb-8">
            <!-- TOL 結果 -->
            <div class="bg-white p-6 rounded-2xl shadow-lg border-t-4 border-emerald-500 flex flex-col">
              <h3 class="text-lg font-bold text-slate-700 mb-4 border-b pb-2">TOL 戰術規劃表現</h3>
              <div class="space-y-3 flex-1">
                <div class="flex justify-between items-center">
                  <span class="text-slate-500">總決策時間 (TPST)</span>
                  <span class="text-xl font-bold text-slate-800">${state.results.tol.time} 秒</span>
                </div>
                <div class="flex justify-between items-center">
                  <span class="text-slate-500">規劃誤差步數 (TMS)</span>
                  <span class="text-xl font-bold ${tolErrors === 0 ? 'text-emerald-500' : 'text-red-500'}">${tolErrors} 次</span>
                </div>
              </div>
              <div class="mt-4 p-3 bg-slate-50 rounded text-sm text-slate-600 leading-relaxed">
                <strong>文獻連結：</strong>研究顯示，高身體活動且低久坐（PHSL）的族群在 TMS（步數誤差）與 TPST（決策時間）表現顯著較佳。您的低誤差代表具備良好的「高階執行功能與計畫效率」。
              </div>
            </div>

            <!-- Stroop 結果 -->
            <div class="bg-white p-6 rounded-2xl shadow-lg border-t-4 border-blue-500 flex flex-col">
              <h3 class="text-lg font-bold text-slate-700 mb-4 border-b pb-2">Stroop 反應抑制表現</h3>
              <div class="space-y-3 flex-1">
                <div class="flex justify-between items-center">
                  <span class="text-slate-500">一致情境反應</span>
                  <span class="text-lg font-bold text-slate-800">${state.results.stroop.congruentTime} ms</span>
                </div>
                <div class="flex justify-between items-center">
                  <span class="text-slate-500">干擾情境反應</span>
                  <span class="text-lg font-bold text-slate-800">${state.results.stroop.incongruentTime} ms</span>
                </div>
                <div class="flex justify-between items-center pt-2 border-t border-slate-100">
                  <span class="font-bold text-slate-700">Stroop 效應遲滯</span>
                  <span class="text-xl font-bold text-amber-500">+${stroopDiff > 0 ? stroopDiff : 0} ms</span>
                </div>
                <div class="flex justify-between items-center">
                  <span class="text-slate-500">整體正確率</span>
                  <span class="text-lg font-bold text-slate-800">${state.results.stroop.accuracy}%</span>
                </div>
              </div>
              <div class="mt-4 p-3 bg-slate-50 rounded text-sm text-slate-600 leading-relaxed">
                <strong>文獻連結：</strong>本測驗衡量「核心執行功能」。研究指出，身體活動對 Stroop 測驗表現的影響無顯著差異，代表抑制控制能力可能較不受單純活動量影響，而需專項的抗干擾訓練。
              </div>
            </div>
          </div>

          <button onclick="resetAll()" class="bg-slate-800 text-white px-8 py-3 rounded-full font-bold flex items-center gap-2 hover:bg-slate-700 transition-colors">
            <i data-lucide="rotate-ccw" class="w-5 h-5"></i> 重新進行綜合測試
          </button>
        </div>
      `;
    }

    // --- 核心渲染綁定 ---
    function updateDOM() {
      const appContentDOM = document.getElementById('app');
      
      let contentHtml = '';
      if (state.screen === 'menu') contentHtml = renderMenu();
      else if (state.screen === 'tol_intro') contentHtml = renderTolIntro();
      else if (state.screen === 'tol_game') contentHtml = renderTolGame();
      else if (state.screen === 'stroop_intro') contentHtml = renderStroopIntro();
      else if (state.screen === 'stroop_game') contentHtml = renderStroopGame();
      else if (state.screen === 'results') contentHtml = renderResults();

      appContentDOM.innerHTML = `
        <div class="min-h-screen bg-slate-50 font-sans text-slate-800 flex flex-col w-full">
          <!-- 導覽列 -->
          <header class="bg-white shadow-sm p-4 flex items-center justify-between w-full">
            <div class="flex items-center gap-2 text-emerald-700 font-black text-xl tracking-wider">
              <div class="w-8 h-8 bg-emerald-500 rounded-full flex items-center justify-center text-white text-sm">🏓</div>
              認知訓練實驗室
            </div>
            ${state.screen !== 'menu' 
              ? `<button onclick="setScreen('menu')" class="text-slate-400 hover:text-slate-600 font-semibold text-sm">返回主選單</button>` 
              : ''}
          </header>

          <!-- 主要內容區 -->
          <main class="flex-1 flex items-center justify-center p-4 w-full">
            ${contentHtml}
          </main>
        </div>
      `;

      // 渲染完成後重新繪製 Lucide 圖示
      lucide.createIcons();
    }

    // 初始化第一次渲染
    updateDOM();

  </script>
</body>
</html>
